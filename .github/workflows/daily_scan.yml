name: Nightly Screener Pipeline

on:
  schedule:
    # Taipei 19:00 = UTC 11:00 (weekdays only)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: "Ticker limit for testing (empty = full scan)"
        required: false
        default: ""

# Prevent concurrent runs — if a manual rerun comes while scheduled is running,
# the new one waits.  This avoids corrupting recommendations.csv via concurrent writes.
concurrency:
  group: nightly-screener
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install . --force-reinstall

      - name: Validate market date
        id: market
        run: |
          # Quick check: ^TWII should have data for today or yesterday
          python3 -c "
          import yfinance as yf, pandas as pd
          from datetime import datetime, timezone, timedelta
          tpe = timezone(timedelta(hours=8))
          today = datetime.now(tpe).date()
          bm = yf.download('^TWII', period='5d', interval='1d', progress=False)
          if bm is not None and not bm.empty:
              last = bm.index[-1].date()
              diff = (today - last).days
              print(f'benchmark_last_date={last}')
              print(f'days_stale={diff}')
              if diff > 5:
                  print('WARNING: Benchmark data is more than 5 days stale')
          else:
              print('WARNING: Could not fetch benchmark for validation')
          "

      - name: Run nightly pipeline
        id: pipeline
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_RECIPIENT: ${{ secrets.SMTP_RECIPIENT }}
        shell: bash
        run: |
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            squeeze-tw nightly --limit "$LIMIT" 2>&1 | tee nightly_output.log
          else
            squeeze-tw nightly 2>&1 | tee nightly_output.log
          fi
          echo "status=completed" >> $GITHUB_OUTPUT

      - name: Commit and push tracking data
        if: always()
        run: |
          # Copy latest scan JSON to fixed path for Web dashboard
          _latest_json=$(ls -t exports/*/scan_results_*.json 2>/dev/null | head -1)
          if [ -n "$_latest_json" ]; then
            mkdir -p exports/latest
            cp "$_latest_json" exports/latest/scan_results.json
            echo "Copied $_latest_json → exports/latest/scan_results.json"
          fi
          git add "exports/*/scan_results_*.csv" "exports/*/scan_summary_*.md" \
                 "exports/*/data-quality_*.md" "exports/*/tracking-analysis_*.md" \
                 exports/latest/scan_results.json \
                 recommendations.csv
          if git diff --cached --quiet; then
            echo "No changes to commit. Skipping."
          else
            git commit -m "chore: nightly scan results [skip ci]"
            git push
          fi

      - name: Upload full artifacts (charts, JSON, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            exports/**/*.csv
            exports/**/*.json
            exports/**/*.md
            exports/**/*.png
            recommendations.csv
            nightly_output.log
          retention-days: 30
