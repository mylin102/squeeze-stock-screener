<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squeeze TW — 台股擠壓動能戰情室</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans TC',sans-serif; background:#f0f2f5; color:#1a1a2e; font-size:15px; }
.font-mono { font-family:'JetBrains Mono',monospace; }
[v-cloak] { display:none !important; }

/* Layout */
.max-w-7xl { max-width:1280px; margin:0 auto; padding:24px 16px; }

/* Cards */
.card { background:white; border-radius:16px; padding:24px; box-shadow:0 1px 8px rgba(0,0,0,0.06); margin-bottom:16px; }

/* Table */
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:12px 8px; font-size:12px; color:#666; border-bottom:2px solid #eee; cursor:pointer; user-select:none; white-space:nowrap; }
th:hover { color:#1a73e8; }
td { padding:10px 8px; border-bottom:1px solid #f0f0f0; font-size:14px; }
tr:hover td { background:#f8f9ff; }
tr.selected td { background:#e8f0fe; }

/* Squeeze indicators */
.sqz-on { color:#e94560; font-weight:700; }
.sqz-off { color:#10b981; font-weight:700; }
.sqz-fired { color:#f59e0b; font-weight:700; }

/* Score badges */
.score-high { background:#e94560; color:white; padding:2px 10px; border-radius:20px; font-weight:700; font-size:13px; }
.score-mid { background:#f59e0b; color:white; padding:2px 10px; border-radius:20px; font-weight:700; font-size:13px; }
.score-low { background:#6b7280; color:white; padding:2px 10px; border-radius:20px; font-weight:700; font-size:13px; }

/* Buttons */
.btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:50px; font-weight:700; font-size:14px; cursor:pointer; border:none; transition:all 0.2s; }
.btn-primary { background:#1a73e8; color:white; }
.btn-primary:hover { background:#1557b0; transform:translateY(-1px); }
.btn-sm { padding:6px 14px; font-size:12px; }

/* Search */
.search-box { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.search-box input { flex:1; min-width:200px; padding:12px 16px; border:2px solid #e0e0e0; border-radius:12px; font-size:15px; outline:none; }
.search-box input:focus { border-color:#1a73e8; }

/* Filters */
.filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.filter-chip { padding:6px 16px; border-radius:50px; font-size:13px; font-weight:500; cursor:pointer; border:1px solid #ddd; background:white; transition:all 0.2s; }
.filter-chip.active { background:#1a73e8; color:white; border-color:#1a73e8; }
.filter-chip:hover { border-color:#1a73e8; }

/* Progress bar */
.progress-bar { height:4px; background:#e0e0e0; border-radius:4px; overflow:hidden; margin:16px 0; }
.progress-fill { height:100%; background:linear-gradient(90deg,#1a73e8,#e94560); border-radius:4px; transition:width 0.3s; }

/* Detail panel */
.detail-panel { animation:fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* Stat grid */
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:16px 0; }
.stat-card { background:#f8f9fa; border-radius:12px; padding:16px; text-align:center; }
.stat-card .label { font-size:12px; color:#666; margin-bottom:4px; }
.stat-card .value { font-size:24px; font-weight:900; }

/* Chart placeholder */
.chart-placeholder { background:#f8f9fa; border:2px dashed #ddd; border-radius:16px; padding:48px; text-align:center; margin:16px 0; }
.chart-placeholder img { max-width:100%; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
.chart-placeholder .hint { color:#999; font-size:14px; margin-top:12px; }

/* Loading spinner */
.spinner { width:48px; height:48px; border:6px solid #e0e0e0; border-top-color:#1a73e8; border-radius:50%; animation:spin 0.8s linear infinite; margin:48px auto; }
@keyframes spin { to { transform:rotate(360deg); } }

@media(max-width:640px) {
  .stat-grid { grid-template-columns:repeat(2,1fr); }
  table { font-size:13px; }
  td,th { padding:8px 4px; }
}
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="max-w-7xl">

    <!-- Header -->
    <header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px;">
      <div>
        <h1 style="font-size:28px;font-weight:900;">📈 Squeeze TW 戰情室</h1>
        <p style="color:#666;font-size:14px;">台股 Squeeze Momentum 擠壓動能掃描</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:13px;color:#666;">📅 {{ metadata.timestamp?.slice(0,10) || '—' }}</span>
        <span style="font-size:13px;color:#666;">📊 {{ results.length }} 檔</span>
        <button @click="fetchData" class="btn btn-primary btn-sm">🔄 重新整理</button>
      </div>
    </header>

    <!-- Loading -->
    <div v-if="isLoading" style="text-align:center;padding:80px 0;">
      <div class="spinner"></div>
      <p style="color:#666;margin-top:16px;">載入掃描資料中...</p>
    </div>

    <!-- Error -->
    <div v-if="errorMsg" class="card" style="text-align:center;padding:48px;color:#e94560;">
      <p style="font-size:18px;font-weight:700;">❌ {{ errorMsg }}</p>
      <button @click="fetchData" class="btn btn-primary" style="margin-top:16px;">重試</button>
    </div>

    <template v-if="!isLoading && !errorMsg">

      <!-- Stats Bar -->
      <div class="stat-grid">
        <div class="stat-card"><div class="label">掃描標的</div><div class="value">{{ results.length }}</div></div>
        <div class="stat-card"><div class="label">擠壓中 🔒</div><div class="value" style="color:#e94560;">{{ squeezeOnCount }}</div></div>
        <div class="stat-card"><div class="label">剛釋放 🔓</div><div class="value" style="color:#f59e0b;">{{ squeezeFiredCount }}</div></div>
        <div class="stat-card"><div class="label">多頭動能 🚀</div><div class="value" style="color:#10b981;">{{ bullishCount }}</div></div>
        <div class="stat-card"><div class="label">空頭動能 💀</div><div class="value" style="color:#e94560;">{{ bearishCount }}</div></div>
      </div>

      <!-- Search + Filters -->
      <div class="card">
        <div class="search-box">
          <input v-model="search" placeholder="搜尋股票代號或名稱 (e.g. 2330, 台積電)" @input="onSearch">
          <button @click="clearFilters" class="btn btn-sm" style="background:#eee;">✕ 清除篩選</button>
        </div>
        <div class="filter-bar" style="margin-top:12px;">
          <span class="filter-chip" :class="{active:filter==='all'}" @click="filter='all'">全部</span>
          <span class="filter-chip" :class="{active:filter==='squeeze_on'}" @click="filter='squeeze_on'">🔒 擠壓中</span>
          <span class="filter-chip" :class="{active:filter==='squeeze_fired'}" @click="filter='squeeze_fired'">🔥 剛釋放</span>
          <span class="filter-chip" :class="{active:filter==='bullish'}" @click="filter='bullish'">📈 多頭</span>
          <span class="filter-chip" :class="{active:filter==='bearish'}" @click="filter='bearish'">📉 空頭</span>
          <span class="filter-chip" :class="{active:filter==='top_score'}" @click="filter='top_score'">⭐ 高分群</span>
        </div>
      </div>

      <!-- Add comment: detail panel moved above table for immediate chart visualization when selected -->
      <div v-if="selected" class="card detail-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
          <h2 style="font-size:22px;font-weight:900;">
            {{ selected.ticker }} {{ selected.name || '' }}
            <span style="font-size:14px;font-weight:400;color:#666;margin-left:8px;">{{ selected.industry || '' }}</span>
          </h2>
          <button @click="selected=null" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">✕</button>
        </div>

        <div class="stat-grid" style="margin-top:16px;">
          <div class="stat-card"><div class="label">Squeeze 評分</div><div class="value" :style="{color:scoreColor(selected.score)}">{{ (selected.score||0).toFixed(1) }}</div></div>
          <div class="stat-card"><div class="label">Squeeze 狀態</div><div class="value">
            <span v-if="selected.squeeze_fired" style="color:#f59e0b;">🔥 釋放</span>
            <span v-else-if="selected.squeeze_on" style="color:#e94560;">🔒 壓縮</span>
            <span v-else style="color:#10b981;">🔓 正常</span>
          </div></div>
          <div class="stat-card"><div class="label">動能</div><div class="value" :style="{color:selected.momentum>0?'#10b981':'#e94560'}">{{ selected.momentum?.toFixed(1) || '—' }}</div></div>
          <div class="stat-card"><div class="label">能量級別</div><div class="value">{{ selected.energy_level || '—' }}</div></div>
          <div class="stat-card"><div class="label">RS 比率</div><div class="value">{{ selected.rs_ratio?.toFixed(1) || '—' }}</div></div>
          <div class="stat-card"><div class="label">成交量</div><div class="value" style="font-size:18px;">{{ selected.volume ? fmtVolume(selected.volume) : '—' }}</div></div>
        </div>

        <!-- Chart -->
        <div class="chart-placeholder" v-if="chartUrl && !chartError">
          <img :src="chartUrl" alt="Chart" @error="chartError=true">
        </div>
        <div class="chart-placeholder" v-else-if="chartUrl && chartError">
          <p class="hint">📊 夜間掃描尚未為此標的生成圖表（僅限前 30 名優先標的）</p>
        </div>
      </div>

      <!-- Results Table -->
      <div class="card" style="padding:0;overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th @click="sortBy='ticker';sortDir*=-1">#</th>
              <th @click="sortBy='ticker';sortDir*=-1">代號</th>
              <th @click="sortBy='name';sortDir*=-1">名稱</th>
              <th @click="sortBy='score';sortDir*=-1">評分</th>
              <th @click="sortBy='squeeze_on';sortDir*=-1">Squeeze</th>
              <th @click="sortBy='momentum';sortDir*=-1">動能</th>
              <th @click="sortBy='energy_level';sortDir*=-1">能量</th>
              <th @click="sortBy='rs_ratio';sortDir*=-1">RS</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(s,i) in sortedResults" :key="s.ticker"
                :class="{selected:selected?.ticker===s.ticker}"
                @click="selectStock(s)">
              <td>{{ i+1 }}</td>
              <td class="font-mono" style="font-weight:700;">{{ s.ticker }}</td>
              <td>{{ s.name || '—' }}</td>
              <td><span class="score-badge" :class="scoreClass(s.score)">{{ (s.score||0).toFixed(1) }}</span></td>
              <td>
                <span v-if="s.squeeze_fired" class="sqz-fired">🔥 釋放</span>
                <span v-else-if="s.squeeze_on" class="sqz-on">🔒 壓縮</span>
                <span v-else class="sqz-off">🔓 正常</span>
              </td>
              <td :style="{color:s.momentum>0?'#10b981':'#e94560',fontWeight:700}">{{ s.momentum > 0 ? '📈' : '📉' }} {{ s.momentum?.toFixed(1) }}</td>
              <td>{{ s.energy_level || '—' }}</td>
              <td class="font-mono">{{ s.rs_ratio?.toFixed(1) || '—' }}</td>
              <!-- Add comment: call selectStock(s) on chart button click to trigger detail panel and display chart -->
              <td><button class="btn btn-primary btn-sm" @click.stop="selectStock(s)">📊 圖表</button></td>
            </tr>
          </tbody>
        </table>
        <div v-if="sortedResults.length===0" style="text-align:center;padding:48px;color:#999;">
          無符合條件的標的
        </div>
      </div>

    </template>
  </div>
</div>

<script>
const DATA_URL = 'data/latest.json';

const { createApp, ref, computed, watch } = Vue;

createApp({
  setup() {
    const results = ref([]);
    const metadata = ref({});
    const isLoading = ref(true);
    const errorMsg = ref('');
    const search = ref('');
    const filter = ref('all');
    const sortBy = ref('score');
    const sortDir = ref(-1);
    const selected = ref(null);
    const chartError = ref(false);
    const chartUrl = computed(() => {
      if (!selected.value) return '';
      const tickerStem = selected.value.ticker.split('.')[0];
      return `charts/${tickerStem}_chart.png`;
    });

    async function fetchData() {
      isLoading.value = true; errorMsg.value = '';
      try {
        const r = await fetch(DATA_URL);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        metadata.value = d.metadata || {};
        results.value = (d.results || []).map(s => ({
          ...s,
          ticker: s.ticker || s.symbol || '?',
          name: s.name || s.ticker_name || '',
          score: s.score || s.ranking_score || 0,
          momentum: s.momentum || 0,
          rs_ratio: s.rs_index || s.rs_ratio || s.rs || 0,
          energy_level: s.energy_level || s.energy || 0,
          squeeze_on: !!s.squeeze_on,
          squeeze_fired: s.fired !== undefined ? !!s.fired : !!s.squeeze_fired,
          volume: s.volume || 0,
          price: s.price || s.close || 0,
          change_pct: s.change_pct || 0,
          industry: s.industry || '',
        }));
        // Read ticker from URL params
        const params = new URLSearchParams(window.location.search);
        const sParam = params.get('s');
        if (sParam) {
          const match = results.value.find(x => x.ticker === sParam);
          if (match) selected.value = match;
        }
      } catch(e) { errorMsg.value = String(e); }
      finally { isLoading.value = false; }
    }

    // Kick off data fetch on mount
    fetchData();

    function onSearch() {
      filter.value = 'all';
    }

    function clearFilters() {
      search.value = ''; filter.value = 'all';
    }

    function selectStock(s) {
      // Add comment: update selected stock, reset chart error, update URL, and scroll to detail panel smoothly
      selected.value = s;
      chartError.value = false;
      const url = new URL(window.location);
      url.searchParams.set('s', s.ticker);
      window.history.replaceState({}, '', url);
      Vue.nextTick(() => {
        const el = document.querySelector('.detail-panel');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }

    const filteredResults = computed(() => {
      let list = results.value;
      if (search.value) {
        const q = search.value.toUpperCase();
        list = list.filter(s => s.ticker.includes(q) || (s.name||'').includes(q));
      }
      switch (filter.value) {
        case 'squeeze_on': list = list.filter(s => s.squeeze_on && !s.squeeze_fired); break;
        case 'squeeze_fired': list = list.filter(s => s.squeeze_fired); break;
        case 'bullish': list = list.filter(s => s.momentum > 0); break;
        case 'bearish': list = list.filter(s => s.momentum < 0); break;
        case 'top_score': list = list.filter(s => (s.score||0) >= 4); break;
      }
      return list;
    });

    const sortedResults = computed(() => {
      const list = [...filteredResults.value];
      list.sort((a,b) => {
        let va = a[sortBy.value] ?? 0;
        let vb = b[sortBy.value] ?? 0;
        if (typeof va === 'string') return sortDir.value * va.localeCompare(vb);
        return sortDir.value * (va - vb);
      });
      return list;
    });

    const squeezeOnCount = computed(() => results.value.filter(s => s.squeeze_on && !s.squeeze_fired).length);
    const squeezeFiredCount = computed(() => results.value.filter(s => s.squeeze_fired).length);
    const bullishCount = computed(() => results.value.filter(s => s.momentum > 0).length);
    const bearishCount = computed(() => results.value.filter(s => s.momentum < 0).length);

    function scoreClass(s) { if (s >= 4) return 'score-high'; if (s >= 2) return 'score-mid'; return 'score-low'; }
    function scoreColor(s) { if (s >= 4) return '#e94560'; if (s >= 2) return '#f59e0b'; return '#6b7280'; }
    function fmtVolume(v) { if (v >= 1e8) return (v/1e8).toFixed(1)+'億'; if (v >= 1e4) return (v/1e4).toFixed(0)+'萬'; return v.toLocaleString(); }

    return { results, metadata, isLoading, errorMsg, search, filter, sortBy, sortDir,
             selected, chartUrl, chartError,
             fetchData, onSearch, clearFilters, selectStock,
             filteredResults, sortedResults,
             squeezeOnCount, squeezeFiredCount, bullishCount, bearishCount,
             scoreClass, scoreColor, fmtVolume };
  }
}).mount('#app');
</script>
</body>
</html>
